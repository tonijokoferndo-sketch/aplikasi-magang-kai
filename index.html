<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color"
          content="#0F4C81">

    <meta name="description"
          content="Aplikasi Absensi Magang PT KAI Divre II Sumbar">

    <title>Absensi Magang KAI</title>


    <!-- CSS -->
    <link rel="stylesheet"
          href="./css/style.css">


    <!-- Icon -->
    <link rel="icon"
          type="image/png"
          href="./assets/icon-192.png">


</head>


<body>


    <!-- =====================================
         LOADING
    ====================================== -->

    <div id="loadingScreen">

        <div class="loading-content">

            <div class="loading-logo">
                KAI
            </div>

            <h2>Absensi Magang</h2>

            <p>PT KAI Divre II Sumbar</p>

            <div class="loading-spinner"></div>

        </div>

    </div>


    <!-- =====================================
         APPLICATION
    ====================================== -->

    <main id="app"></main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="./js/config.js"></script>

    <script src="./js/api.js"></script>

    <script src="./js/auth.js"></script>

    <script src="./js/dashboard.js"></script>

    <script src="./assets/lib/html5-qrcode.min.js"></script>

    <script src="./js/scanner.js"></script>

    <script src="./js/app.js"></script>


    <!-- =====================================
         REMOVE OLD SERVICE WORKER
    ====================================== -->

    <script>

        window.addEventListener("load", async function () {

            /*
             * Untuk sementara Service Worker
             * dimatikan agar HP tidak memakai
             * file/cache versi lama.
             */

            if ("serviceWorker" in navigator) {

                try {

                    const registrations =
                        await navigator.serviceWorker.getRegistrations();

                    for (const registration of registrations) {

                        await registration.unregister();

                        console.log(
                            "[SW] Service Worker lama dihapus"
                        );

                    }

                } catch (error) {

                    console.warn(
                        "[SW] Tidak dapat menghapus Service Worker:",
                        error
                    );

                }

            }


            /*
             * Bersihkan cache browser
             * jika Cache API tersedia.
             */

            if ("caches" in window) {

                try {

                    const cacheNames =
                        await caches.keys();

                    for (const cacheName of cacheNames) {

                        await caches.delete(cacheName);

                    }

                    console.log(
                        "[CACHE] Cache lama dibersihkan"
                    );

                } catch (error) {

                    console.warn(
                        "[CACHE] Gagal membersihkan cache:",
                        error
                    );

                }

            }

        });

    </script>


</body>

</html>
