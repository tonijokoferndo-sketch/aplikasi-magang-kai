<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =========================================
         META
    ========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Aplikasi Absensi Magang PT KAI Divre II Sumbar">

    <meta name="theme-color"
          content="#0F4C81">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Absensi KAI">


    <!-- =========================================
         TITLE
    ========================================== -->

    <title>Absensi Magang KAI</title>


    <!-- =========================================
         CSS
    ========================================== -->

    <link rel="stylesheet"
          href="css/style.css">


    <!-- =========================================
         PWA
    ========================================== -->

    <link rel="manifest"
          href="manifest.json">


    <!-- =========================================
         ICON
    ========================================== -->

    <link rel="icon"
          type="image/png"
          href="assets/icon-192.png">

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================== -->

    <div id="loadingScreen">

        <div class="loading-content">

            <div class="loading-logo">
                KAI
            </div>

            <h2>
                Absensi Magang
            </h2>

            <p>
                PT KAI Divre II Sumbar
            </p>

            <div class="loading-spinner"></div>

        </div>

    </div>


    <!-- =========================================
         APLIKASI
         
         Semua tampilan akan dibuat oleh app.js
    ========================================== -->

    <main id="app">

        <!--
            Login / Dashboard / Scanner /
            Riwayat akan dimasukkan di sini
        -->

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <!-- Konfigurasi -->
    <script src="js/config.js"></script>

    <!-- API Google Apps Script -->
    <script src="js/api.js"></script>

    <!-- Authentication -->
    <script src="js/auth.js"></script>

    <!-- Dashboard -->
    <script src="js/dashboard.js"></script>

    <!-- Library QR Scanner (Local) -->
    <script src="assets/lib/html5-qrcode.min.js"
            type="text/javascript"></script>

    <!-- Flag ketika library siap -->
    <script>
        window.Html5QrcodeReady = false;
        
        // Set ready flag when library loads
        if (typeof Html5Qrcode !== 'undefined') {
            window.Html5QrcodeReady = true;
            console.log("[APP] Html5Qrcode immediately available");
        }
        
        window.addEventListener('load', function() {
            if (typeof Html5Qrcode !== 'undefined') {
                window.Html5QrcodeReady = true;
                console.log("[APP] Html5Qrcode ready after window load");
            }
        });
    </script>

    <!-- Scanner aplikasi -->
    <script src="js/scanner.js"></script>

    <!-- Aplikasi utama -->
    <script src="js/app.js"></script>


    <!-- =========================================
         SERVICE WORKER
    ========================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./sw.js")
                        .then(function (registration) {

                            console.log(
                                "Service Worker berhasil:",
                                registration.scope
                            );

                        })
                        .catch(function (error) {

                            console.error(
                                "Service Worker gagal:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
